<div class="flex h-screen flex-col bg-white overflow-hidden">
  <header
    class="h-16 border-b flex items-center px-6 justify-between bg-white z-20 shadow-sm shrink-0"
  >
    <div class="flex items-center gap-2">
      <span class="text-blue-600 text-2xl font-bold"
        >Health<span class="text-gray-800">Finder</span></span
      >
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden relative">
    <div class="w-full md:w-2/3 lg:w-[65%] relative h-full bg-gray-100">
      <div class="absolute top-4 left-4 z-10 w-80">
        <div class="bg-white p-2 rounded shadow-lg flex items-center">
          <i class="pi pi-search text-gray-400 mx-2"></i>

          <input
            type="text"
            (input)="onSearch($event)"
            placeholder="ค้นหาสถานพยาบาล..."
            class="outline-none w-full text-sm"
          />
        </div>
      </div>

      <div #mapViewNode class="w-full h-full"></div>
    </div>

    <div
      class="hidden md:flex md:w-1/3 lg:w-[35%] flex-col border-l border-gray-200 h-full bg-white"
    >
      <div class="p-4 border-b border-gray-100 shrink-0 bg-gray-50">
        <h2 class="text-lg font-bold text-gray-800">รายชื่อสถานพยาบาล</h2>
        <p class="text-gray-500 text-xs mt-1">พบข้อมูล {{ filteredFacilities.length }} แห่ง</p>
      </div>

      <div *ngIf="isLoading" class="p-10 text-center text-gray-400">กำลังโหลดข้อมูล...</div>

      <div *ngIf="!isLoading" class="flex-1 overflow-y-auto listing-scroll p-4 space-y-4">
        <div
          *ngFor="let item of filteredFacilities"
          (click)="highlightOnMap(item)"
          class="group cursor-pointer ..."
        >
          <div class="h-32 bg-gray-200 relative overflow-hidden">
            <img
              [src]="item.imageUrl"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
            />
            <div
              class="absolute bottom-0 left-0 bg-linear-to-t from-black/60 to-transparent w-full p-2"
            >
              <span class="text-white text-xs font-semibold px-2 py-0.5 rounded bg-blue-600/80">
                {{ item.department }}
              </span>
            </div>
          </div>

          <div class="p-3">
            <div class="font-bold text-gray-800 mb-1 leading-tight">{{ item.agency }}</div>
            <div class="text-xs text-gray-500 flex items-start gap-1">
              <i class="pi pi-map-marker mt-0.5"></i>
              <span>{{ item.address }}</span>
            </div>

            <div class="mt-3 flex flex-wrap gap-1">
              <span class="text-[10px] bg-gray-100 text-gray-600 px-2 py-1 rounded-full border">
                {{ item.ministry }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
